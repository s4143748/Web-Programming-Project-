<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="stylelong.css">
</head>
<body>
    <header class="nav">
        <a class="brand" href="home.html">SGS-G3</a>
        <nav class="nav-links">
            <a href="home.html" class="active">Home</a>
            <a href="blog.html">Blog</a>
            <a href="reviews.html">Reviews</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="cart.html">Cart</a>
        </nav>

        <input class="nav-search" type="search" placeholder="Search">
        <a class="avatar" href="profile.html" title="Profile"></a>
    </header>

    <main class="blog-page">
        <div class="blog-toolbar">
            <h1>Blog</h1>

            <input type="search" name="" class="blog-search" placeholder="Seach posts">

            <select class="blog-filter">
                <option>Tags: Select</option>
                <option>News</option>
                <option>Review</option>
                <option>Guide</option>
            </select>

            <button class="btn">+ New post</button>
        </div>

        <section class="blog-preview-list">
            <article class="blog-card">
                <div class="blog-card-image">Cover image</div>

                <span class="blog-tag">Tag</span>

                <h3>Title</h3>

                <p class="muted">by author</p>
            </article>

            <article class="blog-card">
                <div class="blog-card-image">Cover image</div>

                <span class="blog-tag">Tag</span>

                <h3>Title</h3>

                <p class="muted">by author</p>
            </article>

            <article class="blog-card">
                <div class="blog-card-image">Cover image</div>

                <span class="blog-tag">Tag</span>

                <h3>Title</h3>

                <p class="muted">by author</p>
            </article>
        </section>

        <div class="blog-content">

            <section class="post-detail">

                <h2>Post detail</h2>
                
                <h3>Title</h3>

                <p class="muted">by author</p>

                <div class="post-image">Cover image</div>

                <p class="post-text">
                    Full content...
                </p>

                <div class="comments">
                    Comments
                </div>

            </section>

            <section class="new-post">

                <h2>New post</h2>

                <form class="post-form">

                    <label>Title</label>
                    <input type="text">

                    <label>Tags/category</label>
                    <input type="text">

                    <label>Content</label>
                    <textarea></textarea>

                    <label>Cover image</label>
                    <input type="file">

                    <button class="btn">Publish post</button>

                </form>

            </section>
        </div>
    </main>
</body>
</html>
