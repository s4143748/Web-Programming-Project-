<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGS-G3 - Profile</title>
<link rel="stylesheet" href="styleminh.css">
<link rel="stylesheet" href="pages.css">
</head>

<body>
    <header class="nav">
        <a class="brand" href="homepage.html">SGS-G3</a>
        <nav class="nav-links">
            <a href="homepage.html">Home</a>
            <a href="blog.html">Blog</a>
            <a href="reviews.html">Reviews</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="cart&checkout.html">Cart</a>
        </nav>

        <input class="nav-search" type="search" placeholder="Search">
        <a class="avatar active" href="profile.html" title="Profile"></a>
    </header>

    <main class="page">
        <h1 class="page-title">Profile</h1>

        <div class="profile-grid">
            <!-- Sidebar -->
            <aside class="card profile-side">
                <div class="profile-pic"></div>
                <div class="profile-name">Name</div>
                <div class="profile-username">@username</div>
                <button class="btn">Change picture</button>
                <button class="btn">Log out</button>
            </aside>

            <!-- Main column -->
            <div class="profile-main">
                <section class="card edit-card">
                    <h2>Edit profile</h2>
                    <form class="edit-form">
                        <div class="form-row">
                            <label>
                                <span>Name</span>
                                <input type="text">
                            </label>
                            <label>
                                <span>Email</span>
                                <input type="email">
                            </label>
                        </div>

                        <label>
                            <span>Description</span>
                            <textarea rows="3"></textarea>
                        </label>

                        <div class="form-row">
                            <label>
                                <span>New password</span>
                                <input type="password">
                            </label>
                            <label>
                                <span>Confirm</span>
                                <input type="password">
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary">Save changes</button>
                    </form>
                </section>

                <section class="card deactivate-card">
                    <div>
                        <strong>Deactivate account</strong>
                        <p>This will hide your profile.</p>
                    </div>
                    <button class="btn btn-danger">Deactivate...</button>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
